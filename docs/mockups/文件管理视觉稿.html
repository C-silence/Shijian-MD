<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>拾简 · 文件管理视觉稿 v0.2</title>
<style>
:root{--bg:#FFF9FB;--surface:#FFF;--line:#EBD8DE;--text:#2E2A2C;--text-2:#57504F;--muted:#8C8286;
--primary:#E2708F;--primary-deep:#A83C5F;--primary-soft:#FBE6EC;--primary-whisper:#FFF1F5;
--shadow:rgba(90,42,58,.10);--danger:#C0392B;
--pat:linear-gradient(rgba(226,112,143,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(226,112,143,.045) 1px,transparent 1px);
--pat-size:20px 20px;}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#F2EEF0;color:var(--text);font:14px/1.5 -apple-system,"Segoe UI","Noto Sans SC",system-ui,sans-serif;padding:32px 24px 64px}
.page-head{max-width:1320px;margin:0 auto 26px;text-align:center}
.page-head h1{font-size:20px;font-weight:650;letter-spacing:.2px}
.page-head .sub{margin-top:8px;color:#7A7076;font-size:12.5px}
.legend{max-width:780px;margin:14px auto 0;color:#8A8086;font-size:12px;line-height:1.7}
.legend code{background:#E9E3E6;border-radius:4px;padding:1px 5px;font-size:11.5px}
.board{display:flex;flex-direction:column;gap:42px;align-items:center}
.row{display:flex;gap:30px;align-items:flex-start;justify-content:center;flex-wrap:wrap}
.cap{text-align:center;margin-top:12px;font-size:12px;color:#6F656B}
.cap b{display:block;font-size:13px;color:#3A3336;font-weight:600;margin-bottom:2px}
figure{display:flex;flex-direction:column;align-items:center}
.device{position:relative}
.phone .shell{width:378px;height:787px;background:#15161A;border-radius:38px;padding:10px;box-shadow:0 16px 40px rgba(60,30,45,.22)}
.phone .screen{border-radius:29px}
.tablet .shell{width:1016px;height:704px;background:#15161A;border-radius:26px;padding:11px;box-shadow:0 18px 44px rgba(60,30,45,.22)}
.tablet .screen{border-radius:17px}
.screen{width:100%;height:100%;background:var(--bg);background-image:var(--pat);background-size:var(--pat-size);overflow:hidden;display:flex;flex-direction:column;position:relative}
.statusbar{height:28px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;font-size:11px;color:var(--text-2);flex:0 0 auto}
.dots{display:flex;gap:3px}.dot{width:4px;height:4px;border-radius:50%;background:var(--muted);opacity:.6}
.appbar{height:54px;display:flex;align-items:center;gap:6px;padding:0 10px;border-bottom:1px solid var(--line);flex:0 0 auto}
.ibtn{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;color:var(--text-2);flex:0 0 auto}
.ibtn svg{width:19px;height:19px}
.ibtn.pri{color:var(--primary-deep);background:var(--primary-soft)}
.crumb{flex:1;min-width:0;padding:0 2px;font-size:15px;color:var(--muted);display:flex;align-items:center;gap:5px;overflow:hidden;white-space:nowrap}
.crumb .sep{opacity:.55;font-size:12px}.crumb .cur{color:var(--text);font-weight:640}.grow{flex:1}
.content{flex:1;min-height:0;overflow:hidden;padding:12px 14px}
.sec-title{font-size:11.5px;letter-spacing:.9px;color:var(--muted);margin:4px 4px 8px;display:flex;align-items:center;justify-content:space-between}
.sec-title .n{color:var(--primary-deep);background:var(--primary-soft);border-radius:20px;padding:0 7px;font-size:10.5px;letter-spacing:0}
.list{display:flex;flex-direction:column;gap:7px}
.row-item{display:flex;align-items:center;gap:11px;background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:11px 12px;box-shadow:0 1px 2px var(--shadow)}
.ficon{width:32px;height:32px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.ficon.f{background:var(--primary-soft);color:var(--primary-deep)}
.ficon.d{background:#F1EEF0;color:#8B8288}
.ficon svg{width:17px;height:17px}
.meta{flex:1;min-width:0}
.meta .nm{font-size:14px;font-weight:520;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.meta .sub{margin-top:2px;font-size:11px;color:var(--muted);display:flex;align-items:center;gap:6px}
.tag{background:var(--primary-whisper);color:var(--primary-deep);border-radius:5px;padding:0 5px;font-size:10px;line-height:16px}
.ghost{width:26px;height:26px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--muted);flex:0 0 auto}
.ghost svg{width:15px;height:15px}
.cont{display:flex;gap:9px;margin-bottom:14px}
.ccard{flex:1;background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:10px 11px;box-shadow:0 1px 2px var(--shadow)}
.ccard .t{font-size:12.5px;font-weight:560;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ccard .k{margin-top:5px;font-size:10.5px;color:var(--muted)}
.bar{margin-top:7px;height:3px;border-radius:3px;background:var(--primary-soft);overflow:hidden}
.bar i{display:block;height:100%;background:var(--primary);border-radius:3px}
.fab{position:absolute;right:16px;bottom:18px;height:46px;padding:0 18px 0 14px;border-radius:24px;background:var(--primary);color:#fff;display:flex;align-items:center;gap:7px;font-size:13.5px;font-weight:560;box-shadow:0 8px 20px rgba(226,112,143,.42)}
.fab svg{width:17px;height:17px}
.scrim{position:absolute;inset:0;background:rgba(46,42,44,.38);display:flex;flex-direction:column;justify-content:flex-end}
.sheet{background:var(--surface);border-radius:20px 20px 0 0;padding:10px 14px 16px;box-shadow:0 -10px 30px rgba(60,30,45,.20)}
.handle{width:38px;height:4px;border-radius:4px;background:var(--line);margin:0 auto 12px}
.sheet .hd{padding:0 4px 11px;border-bottom:1px solid var(--line);margin-bottom:9px}
.sheet .hd .t{font-size:14.5px;font-weight:600}
.sheet .hd .p{font-size:11px;color:var(--muted);margin-top:2px}
.mi{display:flex;align-items:center;gap:13px;padding:13px 4px;font-size:14.5px}
.mi svg{width:18px;height:18px;color:var(--text-2)}
.mi.red{color:var(--danger)}.mi.red svg{color:var(--danger)}
.mi .k{margin-left:auto;font-size:11.5px;color:var(--muted)}
.actions{display:flex;border-top:1px solid var(--line);background:var(--surface);padding:9px 6px 12px;flex:0 0 auto}
.act{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;color:var(--text-2)}
.act svg{width:19px;height:19px}.act.red{color:var(--danger)}
.chk{width:19px;height:19px;border-radius:6px;border:1.6px solid var(--line);flex:0 0 auto;display:flex;align-items:center;justify-content:center;background:#fff}
.chk.on{background:var(--primary);border-color:var(--primary);color:#fff}
.chk svg{width:12px;height:12px}
.btn{height:46px;border-radius:13px;display:flex;align-items:center;justify-content:center;font-size:14.5px;font-weight:560}
.btn.pri{background:var(--primary);color:#fff;box-shadow:0 6px 16px rgba(226,112,143,.36)}
.btn.ghost{background:transparent;color:var(--text-2);border:1px solid var(--line)}
.btn.block{width:100%}
.center{flex:1;display:flex;flex-direction:column;justify-content:center;padding:0 26px;text-align:center}
.bigicon{width:74px;height:74px;border-radius:22px;background:var(--primary-soft);color:var(--primary-deep);display:flex;align-items:center;justify-content:center;margin:0 auto 18px}
.bigicon svg{width:36px;height:36px}
.center h2{font-size:19px;font-weight:660}
.center p{margin-top:10px;font-size:13px;color:var(--text-2);line-height:1.75}
.pathcard{margin:18px 0;border:1px dashed var(--line);border-radius:13px;padding:12px 14px;background:var(--surface);text-align:left}
.pathcard .l{font-size:10.5px;color:var(--muted);letter-spacing:.5px}
.pathcard .v{margin-top:4px;font-size:13.5px;font-weight:560}
.pathcard .v small{display:block;font-weight:400;color:var(--muted);font-size:11px;margin-top:3px}
.foot-note{margin-top:14px;font-size:11px;color:var(--muted)}
.tpad{display:flex;height:100%}
.tree{width:238px;flex:0 0 auto;border-right:1px solid var(--line);background:var(--surface);padding:12px 10px;display:flex;flex-direction:column}
.tree .hd{font-size:15px;font-weight:650;padding:4px 8px 12px}
.tnode{display:flex;align-items:center;gap:9px;padding:9px 8px;border-radius:10px;font-size:13.5px;color:var(--text-2)}
.tnode.d1{padding-left:26px;font-size:13px}
.tnode.on{background:var(--primary-soft);color:var(--primary-deep);font-weight:600}
.tnode svg{width:16px;height:16px;flex:0 0 auto}
.tnode .n{margin-left:auto;font-size:10.5px;background:var(--primary-soft);color:var(--primary-deep);border-radius:20px;padding:0 6px}
.tnode.on .n{background:#fff}
.tmain{flex:1;min-width:0;display:flex;flex-direction:column}
.thead{padding:10px 16px;border-bottom:1px solid var(--line)}
.search{height:36px;border-radius:11px;background:var(--surface);border:1px solid var(--line);display:flex;align-items:center;gap:8px;padding:0 11px;color:var(--muted);font-size:12.5px}
.search svg{width:15px;height:15px}
.cols{display:flex;gap:12px;padding:9px 16px 4px;font-size:11px;color:var(--muted)}
.tlist{flex:1;overflow:hidden;padding:2px 16px 12px;display:flex;flex-direction:column;gap:6px}
.trow{display:flex;align-items:center;gap:11px;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:9px 12px}
.trow .nm{flex:1;min-width:0;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.trow .c{font-size:11.5px;color:var(--muted);flex:0 0 auto}
.trow .c.w1{width:96px}.trow .c.w2{width:64px;text-align:right}
</style>
</head>
