<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>拾简 · 视觉稿 v0.1</title>
<style>
/* ============ 页面外壳 ============ */
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:#EDEFF3;color:#1B1E23;padding:28px 36px 56px;
  font-family:"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",system-ui,-apple-system,"Segoe UI",sans-serif;
  -webkit-font-smoothing:antialiased;
}
.page-head{display:flex;align-items:flex-end;gap:18px;flex-wrap:wrap}
.page-head h1{margin:0;font-size:20px;letter-spacing:.5px}
.page-head .sub{font-size:12.5px;color:#6B7280;line-height:1.7}
.switcher{margin-left:auto;display:flex;gap:8px}
.switcher button{
  border:1px solid #D3D8DF;background:#fff;border-radius:999px;padding:7px 14px;font-size:12.5px;
  color:#39404A;cursor:pointer;font-family:inherit;transition:.15s;
}
.switcher button:hover{border-color:#9AA3AE}
.switcher button.on{border-color:#1B1E23;box-shadow:0 2px 8px rgba(20,25,35,.12);font-weight:600}
.legend{margin:14px 0 0;font-size:12px;color:#6B7280}
.legend code{background:#fff;border:1px solid #DDE2E8;border-radius:5px;padding:1px 5px;font-size:11.5px}

/* ============ 设备画板 ============ */
.board{display:flex;gap:34px;align-items:flex-start;flex-wrap:wrap;margin-top:26px}
figure.device{margin:0;display:flex;flex-direction:column;gap:10px}
figure.device figcaption{font-size:12.5px;color:#4B5563;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
figure.device figcaption b{font-size:13px;color:#111827}
figure.device figcaption span{color:#7A828C}
.shell{background:#101317;border-radius:34px;padding:9px;box-shadow:0 26px 60px rgba(15,20,30,.22)}
.screen{
  position:relative;display:flex;flex-direction:column;overflow:hidden;
  background:var(--bg);color:var(--text);border-radius:27px;
  transition:background .2s,color .2s;
}
.phone .screen{width:360px;height:740px}
.tablet .shell{border-radius:26px;padding:8px}
.tablet .screen{width:1000px;height:660px;border-radius:19px}
/* 纹理（低透明度，装饰强度：克制档） */
.screen{background-image:var(--pat, none);background-size:var(--pat-size, 20px 20px)}

/* ============ 主题令牌 ============ */
.screen[data-theme="sakura"]{
  --bg:#FFF9FB;--surface:#FFFFFF;--line:#EBD8DE;--text:#2E2A2C;--text-2:#57504F;--muted:#8C8286;
  --primary:#E2708F;--primary-deep:#A83C5F;--primary-soft:#FBE6EC;--primary-whisper:#FFF1F5;
  --link:#B0455F;--shadow:rgba(90,42,58,.10);
  --code-bg:#FBF7F8;--code-head:#F3E7EB;--code-fg:#4A3F44;--inline-bg:#FBEDF1;--inline-fg:#8A2F49;
  --pat:linear-gradient(rgba(226,112,143,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(226,112,143,.045) 1px,transparent 1px);
  --pat-size:20px 20px;
}
.screen[data-theme="caramel"]{
  --bg:#FDF9F5;--surface:#FFFFFF;--line:#EBDCCE;--text:#332C27;--text-2:#5C5148;--muted:#8F8479;
  --primary:#C07A4C;--primary-deep:#8A4D28;--primary-soft:#F7E9DD;--primary-whisper:#FDF4EC;
  --link:#95552C;--shadow:rgba(90,60,30,.11);
  --code-bg:#FBF7F3;--code-head:#F3E9E0;--code-fg:#4A4038;--inline-bg:#F8EDE3;--inline-fg:#8A4D28;
  --pat:repeating-linear-gradient(45deg,rgba(192,122,76,.05) 0 1px,transparent 1px 14px),repeating-linear-gradient(-45deg,rgba(192,122,76,.05) 0 1px,transparent 1px 14px);
  --pat-size:auto;
}
.screen[data-theme="mint"]{
  --bg:#F7FCFB;--surface:#FFFFFF;--line:#D3E7E5;--text:#26302F;--text-2:#4E5C5B;--muted:#7E8C8B;
  --primary:#35A79F;--primary-deep:#137069;--primary-soft:#E0F4F2;--primary-whisper:#EFFAF9;
  --link:#1C7A73;--shadow:rgba(20,80,75,.10);
  --code-bg:#F5FBFA;--code-head:#E7F3F2;--code-fg:#3C4A49;--inline-bg:#E7F6F4;--inline-fg:#137069;
  --pat:radial-gradient(circle,rgba(53,167,159,.07) .6px,transparent .7px);
  --pat-size:14px 14px;
}
.screen[data-theme="sakura"][data-dark="1"]{
  --bg:#1A1B20;--surface:#22242B;--line:#31343C;--text:#E3E5EA;--text-2:#B7BCC5;--muted:#878D97;
  --primary:#E58AA6;--primary-deep:#F3B9CC;--primary-soft:#3A2A32;--primary-whisper:#272127;
  --link:#F0A9BE;--shadow:rgba(0,0,0,.45);
  --code-bg:#1E2026;--code-head:#262830;--code-fg:#C9CDD4;--inline-bg:#33272C;--inline-fg:#F2BCCD;
  --pat:none;--pat-size:auto;
}
.screen[data-dark="1"] .shell,.screen[data-dark="1"]{color-scheme:dark}

/* ============ 状态栏 / 顶栏 / 底栏 ============ */
.statusbar{height:26px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;font-size:10.5px;color:var(--text-2);letter-spacing:.4px}
.statusbar .dots{display:flex;gap:4px;align-items:center}
.statusbar .dot{width:5px;height:5px;border-radius:50%;background:var(--muted);opacity:.55}
.appbar{height:52px;display:flex;align-items:center;gap:6px;padding:0 6px 0 10px;border-bottom:1px solid var(--line);background:var(--surface)}
.appbar .title{flex:1;font-size:14.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.appbar .title small{display:block;font-size:10.5px;font-weight:400;color:var(--muted);margin-top:1px}
.ibtn{width:38px;height:38px;border-radius:19px;display:grid;place-items:center;color:var(--text-2)}
.ibtn svg{width:18px;height:18px}
.bottom{height:50px;display:flex;align-items:center;justify-content:space-between;padding:0 12px;border-top:1px solid var(--line);background:var(--surface)}
.chip{border:1px solid var(--line);border-radius:999px;padding:6px 11px;font-size:11.5px;color:var(--text-2);display:flex;align-items:center;gap:5px}
.chip.pri{background:var(--primary-soft);border-color:transparent;color:var(--primary-deep);font-weight:600}
.content{flex:1;overflow:hidden;padding:16px 18px 0;position:relative;min-height:0}
.content::after{content:"";position:absolute;left:0;right:0;bottom:0;height:34px;background:linear-gradient(transparent,var(--bg));pointer-events:none}
.panes{flex:1;display:flex;min-height:0}
.pane{min-width:0;overflow:hidden;border-right:1px solid var(--line);padding:14px 16px;position:relative}
.pane:last-child{border-right:0;background:var(--bg)}
.pane-head{font-size:10.5px;letter-spacing:1.6px;color:var(--muted);margin-bottom:10px;text-transform:uppercase}
.pane.outline{width:212px;background:var(--surface)}
.pane.editor{flex:1;background:var(--surface)}
.pane.preview{flex:1.12}

/* ============ 文档元素（阅读模式） ============ */
.doc{font-size:14.5px;color:var(--text-2)}
.doc .h1{font-size:25px;line-height:1.35;font-weight:700;color:var(--text);text-align:center;margin:0 0 8px;position:relative;padding-bottom:9px}
.doc .h1::after{content:"";position:absolute;left:50%;transform:translateX(-50%);bottom:0;width:46px;height:3px;border-radius:3px;background:var(--primary)}
.doc .h2{display:inline-block;font-size:18px;font-weight:700;color:var(--primary-deep);background:var(--primary-soft);border-radius:10px;padding:5px 12px;margin:11px 0 6px}
.doc .h3{font-size:16px;font-weight:700;color:var(--text);border-left:3px solid var(--primary);border-radius:2px;padding-left:9px;margin:10px 0 5px}
.doc .h4{font-size:14.5px;font-weight:700;color:var(--text);display:flex;align-items:center;gap:7px;margin:7px 0 3px}
.doc .h4::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--primary)}
.doc .h5{font-size:14px;font-weight:700;color:var(--text);display:flex;align-items:center;gap:7px;margin:6px 0 3px}
.doc .h5::before{content:"";width:8px;height:8px;border-radius:50%;border:1.6px solid var(--primary);box-sizing:border-box}
.doc .h6{font-size:13.5px;font-weight:700;color:var(--text-2);display:flex;align-items:center;gap:7px;margin:6px 0 2px}
.doc .h6::before{content:"";width:12px;height:2px;border-radius:2px;background:var(--muted)}
.doc p{margin:6px 0;line-height:1.72}
.doc b{color:var(--primary-deep)}
.doc em{font-style:italic;opacity:.92}
.doc del{color:var(--muted);text-decoration-color:var(--muted)}
.doc mark{background:var(--primary-soft);color:inherit;border-radius:4px;padding:1px 5px}
.doc a{color:var(--link);text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1px}
.doc code{font-family:"Cascadia Mono",Consolas,"SF Mono",ui-monospace,monospace;font-size:12.5px;background:var(--inline-bg);color:var(--inline-fg);border-radius:4px;padding:2px 6px}
.doc kbd{font-family:Consolas,ui-monospace,monospace;font-size:11.5px;color:var(--primary-deep);background:var(--surface);border:1px solid var(--line);border-bottom-width:2.5px;border-radius:5px;padding:2px 6px;margin:0 1px}
.doc blockquote{position:relative;margin:9px 0;padding:10px 13px 10px 14px;background:var(--primary-whisper);border-left:3.5px solid var(--primary);border-radius:12px}
.doc blockquote p{margin:0;color:var(--text-2)}
.doc blockquote .qmark{color:var(--primary);font-weight:700;font-size:13px;letter-spacing:1px}
.doc ul{margin:7px 0;padding-left:20px;line-height:1.72}
.doc li{margin:3px 0}
.doc .tasks{list-style:none;padding-left:0}
.doc .task{display:flex;gap:9px;align-items:flex-start;margin:5px 0}
.doc .cb{flex:none;width:18px;height:18px;border-radius:5px;border:1.6px solid var(--primary);display:grid;place-items:center;margin-top:2px;background:var(--surface)}
.doc .cb.on{background:var(--primary);border-color:var(--primary)}
.doc .cb svg{width:11px;height:11px;color:#fff}
.doc .task.done{color:var(--muted);text-decoration:line-through;text-decoration-thickness:1.5px}
.doc .toc{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px;margin:10px 0;box-shadow:0 6px 18px var(--shadow)}
.doc .toc-title{text-align:center;font-size:12.5px;font-weight:700;letter-spacing:3px;color:var(--primary-deep);padding-bottom:7px;margin-bottom:5px;border-bottom:1px dashed var(--line)}
.doc .toc a{display:block;font-size:12.5px;color:var(--text-2);text-decoration:none;padding:6px 10px;border-radius:999px;margin:2px 0}
.doc .toc a.on{background:var(--primary-soft);color:var(--primary-deep);font-weight:600;box-shadow:inset 3px 0 0 var(--primary);border-radius:8px}
.doc .toc a.lv2{padding-left:22px;color:var(--muted)}
.doc .toc a.lv3{padding-left:34px;color:var(--muted);font-size:12px}
.doc .props{border:1px dashed var(--line);background:var(--surface);border-radius:10px;padding:9px 12px;margin:11px 0;font-size:12px;color:var(--muted);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.doc .props .tag{background:var(--primary-whisper);color:var(--primary-deep);border-radius:6px;padding:2px 7px;font-size:11px;font-weight:600}
.doc .props code{background:transparent;color:var(--text-2);padding:0;font-size:11.5px}
.doc figure.code{margin:11px 0;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--code-bg)}
.doc .code-head{display:flex;align-items:center;justify-content:space-between;background:var(--code-head);padding:6px 11px;font-size:11px;color:var(--text-2);letter-spacing:.4px}
.doc .code-head .copy{border:1px solid var(--line);border-radius:6px;padding:2px 7px;background:var(--surface);font-size:10.5px}
.doc .code-body{padding:11px 12px;font-family:"Cascadia Mono",Consolas,ui-monospace,monospace;font-size:12px;line-height:1.75;color:var(--code-fg);white-space:pre;overflow:hidden}
.tok-k{color:#A626A4;font-weight:700}.tok-s{color:#3E8E41}.tok-n{color:#1694B6}.tok-c{color:#9A9A92}.tok-f{color:#B07A00}.tok-t{color:#4E8E8E}
.screen[data-dark="1"] .tok-k{color:#D9A8DE}.screen[data-dark="1"] .tok-s{color:#8ECf8A}.screen[data-dark="1"] .tok-n{color:#7FC7DE}.screen[data-dark="1"] .tok-c{color:#7E838C}.screen[data-dark="1"] .tok-f{color:#E3C170}.screen[data-dark="1"] .tok-t{color:#8FC4C4}
.doc table{width:100%;border-collapse:separate;border-spacing:0;border:1px solid var(--line);border-radius:12px;overflow:hidden;font-size:12.5px;margin:11px 0}
.doc th{background:var(--primary-whisper);color:var(--primary-deep);font-weight:600;text-align:left;padding:8px 10px;white-space:nowrap}
.doc td{padding:8px 10px;color:var(--text-2);border-top:1px solid var(--line)}
.doc hr{border:0;border-top:1.5px dashed var(--line);margin:15px 0}
.doc .imgph{height:104px;border-radius:12px;background:linear-gradient(135deg,var(--primary-soft),var(--primary-whisper));display:grid;place-items:center;color:var(--primary-deep);font-size:11.5px;letter-spacing:.5px;border:1px solid var(--line)}
.doc .cap{text-align:center;font-size:11.5px;color:var(--muted);margin-top:6px}
.doc .footnote{font-size:11.5px;color:var(--muted);border-top:1px solid var(--line);margin-top:14px;padding-top:8px;line-height:1.7}
.doc .sup{font-size:10px;color:var(--link);vertical-align:super}

/* ============ 编辑器（源码模式） ============ */
.editor-body{font-family:"Cascadia Mono",Consolas,"SF Mono",ui-monospace,monospace;font-size:12px;line-height:1.95;color:var(--text-2)}
.editor-body .ln{display:flex;gap:11px;white-space:pre}
.editor-body .no{flex:none;width:16px;text-align:right;color:var(--muted);opacity:.65;font-size:11px}
.editor-body .src-m{color:var(--primary);font-weight:700}
.editor-body .src-h{color:var(--text);font-weight:700}
.editor-body .src-c{color:var(--muted)}
.editor-body .caret{display:inline-block;width:1.5px;height:14px;background:var(--primary);vertical-align:-2px;animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.toolbar{height:46px;display:flex;align-items:center;gap:6px;padding:0 10px;border-top:1px solid var(--line);background:var(--surface);overflow:hidden}
.toolbar .tbtn{flex:none;min-width:34px;height:30px;border-radius:8px;border:1px solid var(--line);display:grid;place-items:center;font-size:12px;color:var(--text-2);font-family:Consolas,monospace}
.toolbar .tbtn.pri{background:var(--primary-soft);border-color:transparent;color:var(--primary-deep);font-weight:700}
.toolbar .gap{flex:1}

/* ============ 大纲 ============ */
.outline-list{font-size:12.5px}
.outline-list a{display:block;color:var(--text-2);text-decoration:none;padding:6px 9px;border-radius:999px;margin:1px 0}
.outline-list a.lv2{padding-left:20px;color:var(--muted)}
.outline-list a.lv3{padding-left:32px;color:var(--muted);font-size:12px}
.outline-list a.on{background:var(--primary-soft);color:var(--primary-deep);font-weight:600;border-radius:8px;box-shadow:inset 3px 0 0 var(--primary)}
</style>
</head>
<body>

<header class="page-head">
  <div>
    <h1>拾简 · 视觉稿 <span style="font-size:12px;color:#7A828C;font-weight:400">v0.1</span></h1>
    <div class="sub">三套主题（樱 / 焦糖 / 薄荷）× 手机与平板两种形态 &nbsp;·&nbsp; 装饰强度：克制档（纹理 ≤ 2%）</div>
  </div>
  <div class="switcher">
    <button data-set="sakura" class="on">樱（默认）</button>
    <button data-set="caramel">焦糖</button>
    <button data-set="mint">薄荷</button>
    <button data-set="dark">樱 · 深色</button>
  </div>
</header>
<p class="legend">这是静态原型，只用于确认 <code>版式层级</code> / <code>配色</code> / <code>元素规范</code>；正式实现为 Compose 原生渲染，尺寸全部按 dp·sp 落地（本页 1px ≈ 1dp）。</p>

<main class="board">

  <figure class="device phone">
    <div class="shell"><div class="screen" data-theme="sakura">
      <div class="statusbar"><span>9:41</span><span class="dots"><span class="dot"></span><span class="dot"></span><span class="dot"></span></span></div>
      <div class="appbar">
        <div class="ibtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></div>
        <div class="title">拾简 · 使用说明<small>已自动保存 · 1.2 KB</small></div>

        <div class="ibtn"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="1.7"/><circle cx="12" cy="12" r="1.7"/><circle cx="12" cy="19" r="1.7"/></svg></div>

      <div class="content" data-slot="doc"></div>

        <span class="chip pri">编辑</span>
      </div>
    </div></div>
    <figcaption><b>手机 · 阅读</b><span>单栏 · 顶栏 52dp · 底部缩放与模式切换</span></figcaption>
  </figure>

  <figure class="device phone">
    <div class="shell"><div class="screen" data-theme="sakura">
      <div class="statusbar"><span>9:41</span><span class="dots"><span class="dot"></span><span class="dot"></span><span class="dot"></span></span></div>
      <div class="appbar">
        <div class="ibtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M14 6l-6 6 6 6"/></svg></div>

        <span class="tbtn pri">H1</span><span class="tbtn">B</span><span class="tbtn" style="font-style:italic">I</span>
        <span class="tbtn">•</span><span class="tbtn">链接</span><span class="tbtn">图</span><span class="tbtn">{ }</span>
        <span class="gap"></span><span class="tbtn">预览</span>
      </div>
    </div></div>

  </figure>

</main>

<template id="tpl-doc-top">

<script>
(function () {
  var params = new URLSearchParams(location.search);
  var current = params.get("theme") || "sakura";
  var forceDark = params.get("dark") === "1";

  var tpl = {
    docTop: document.getElementById("tpl-doc-top"),
    docBottom: document.getElementById("tpl-doc-bottom"),
    editor: document.getElementById("tpl-editor"),
    outline: document.getElementById("tpl-outline")
  };

  document.querySelectorAll('[data-slot="doc"]').forEach(function (slot) {
    var isTablet = !!slot.closest(".tablet");
    slot.appendChild((isTablet ? tpl.docBottom : tpl.docTop).content.cloneNode(true));
  });
  document.querySelectorAll('[data-slot="editor"]').forEach(function (slot) {
    slot.appendChild(tpl.editor.content.cloneNode(true));
  });
  document.querySelectorAll('[data-slot="outline"]').forEach(function (slot) {
    slot.appendChild(tpl.outline.content.cloneNode(true));
  });

  function apply(name) {
    current = name;
    document.querySelectorAll(".screen").forEach(function (s) {
      s.dataset.theme = name === "dark" ? "sakura" : name;
      s.dataset.dark = (name === "dark" || forceDark) ? "1" : "0";
    });
    document.querySelectorAll(".switcher button").forEach(function (b) {
      b.classList.toggle("on", b.dataset.set === name);
    });
  }

  document.querySelectorAll(".switcher button").forEach(function (b) {
    b.addEventListener("click", function () { apply(b.dataset.set); });
  });
  apply(current);
})();
</script>
